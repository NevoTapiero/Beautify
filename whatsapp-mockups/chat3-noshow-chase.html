<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>WhatsApp mockup 3</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  body { margin:0; padding:40px; background:#f0f0f0; font-family: Arial, sans-serif; display:flex; justify-content:center; }
</style>
</head>
<body>
<div style="width:320px; border-radius:28px; overflow:hidden; border:6px solid #1f1f1f; background:#000; box-shadow:0 0 0 1px rgba(0,0,0,0.1);">

  <div style="background:#075E54; color:#fff; padding:10px 14px; display:flex; align-items:center; gap:10px;">
    <div style="width:36px; height:36px; border-radius:50%; background:#25D366; display:flex; align-items:center; justify-content:center; font-weight:500; font-size:14px; color:#075E54; flex:none;">ר</div>
    <div style="flex:1;">
      <div style="font-size:14px; font-weight:500;">רותם (לקוחה)</div>
      <div style="font-size:11px; opacity:0.85;">לאחרונה נראתה אתמול ב-22:03</div>
    </div>
    <i class="ti ti-dots-vertical" style="font-size:18px;"></i>
  </div>

  <div style="background:#E5DDD5; padding:12px 10px; display:flex; flex-direction:column; gap:8px; min-height:420px;">

    <div style="align-self:center; background:rgba(0,0,0,0.08); border-radius:6px; padding:3px 10px; font-size:11px; color:#555;">אתמול</div>

    <div style="align-self:flex-start; max-width:78%; display:flex; flex-direction:column; gap:2px;">
      <div style="background:#DCF8C6; border-radius:8px 8px 2px 8px; padding:7px 10px; font-size:13.5px; color:#111;">היי רותם 🤍 רק מזכירה שיש לנו תור מחר ב-16:00</div>
      <span style="font-size:10px; color:#7d7d7d; align-self:flex-end; padding:0 4px;">18:00</span>
    </div>

    <div style="align-self:flex-start; max-width:70%; background:#fff; border-radius:8px 8px 2px 8px; padding:8px 12px; display:flex; gap:5px; align-items:center;">
      <span style="width:6px; height:6px; border-radius:50%; background:#9e9e9e;"></span>
      <span style="width:6px; height:6px; border-radius:50%; background:#9e9e9e;"></span>
      <span style="width:6px; height:6px; border-radius:50%; background:#9e9e9e;"></span>
    </div>

    <div style="align-self:center; background:rgba(0,0,0,0.08); border-radius:6px; padding:3px 10px; font-size:11px; color:#555;">היום</div>

    <div style="align-self:flex-start; max-width:78%; display:flex; flex-direction:column; gap:2px;">
      <div style="background:#DCF8C6; border-radius:8px 8px 2px 8px; padding:7px 10px; font-size:13.5px; color:#111;">בעוד שעה התור שלך, מגיעה? 😊</div>
      <span style="font-size:10px; color:#7d7d7d; align-self:flex-end; padding:0 4px;">15:00 · נשלחה</span>
    </div>

    <div style="align-self:flex-start; max-width:78%; display:flex; flex-direction:column; gap:2px;">
      <div style="background:#DCF8C6; border-radius:8px 8px 2px 8px; padding:7px 10px; font-size:13.5px; color:#111;">רותם? יש לך תור עכשיו 👀</div>
      <span style="font-size:10px; color:#7d7d7d; align-self:flex-end; padding:0 4px;">16:05 · נשלחה</span>
    </div>

    <div style="align-self:flex-start; max-width:78%; display:flex; flex-direction:column; gap:2px;">
      <div style="background:#DCF8C6; border-radius:8px 8px 2px 8px; padding:7px 10px; font-size:13.5px; color:#111;">אוקיי כנראה שלא מגיעה... נדבר 😕</div>
      <span style="font-size:10px; color:#7d7d7d; align-self:flex-end; padding:0 4px;">16:20 · נשלחה</span>
    </div>

    <div style="align-self:center; background:rgba(255,255,255,0.6); border-radius:8px; padding:6px 12px; font-size:12px; color:#555; margin-top:6px;">שעה פנויה שאיש לא ניצל, ואפס תזכורת אוטומטית</div>
  </div>
</div>
</body>
</html>
